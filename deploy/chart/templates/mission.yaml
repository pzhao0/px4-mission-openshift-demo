apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mission
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mission
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mission
      annotations:
        checksum/transport: {{ tpl (.Files.Get "files/zenoh-mission.json5") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-runtime
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/arch: amd64}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: transport
          configMap: {name: "{{ .Release.Name }}-mission-transport"}
        - name: mission-tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: agent-tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: viewer-tmp
          emptyDir: {sizeLimit: 256Mi}
      containers:
        - name: mission
          image: {{ index .Values.images "mission" | quote }}
          # The mode registration timeout is shorter than a cold simulator start.
          # Wait for the pinned PX4 heartbeat before launching the executor.
          args:
            - bash
            - -ec
            - |
              ros2 topic echo --once --qos-reliability best_effort \
                /fmu/out/vehicle_status_v4 px4_msgs/msg/VehicleStatus >/dev/null
              exec /opt/mission/entrypoint.sh mission
          env:
            # Keep DDS discovery multicast. Large camera samples use unicast.
            - name: CYCLONEDDS_URI
              value: "<CycloneDDS><Domain><General><AllowMulticast>spdp</AllowMulticast></General></Domain></CycloneDDS>"
            - name: SURVEY_ENABLED
              value: "true"
            - name: SURVEY_ONNX_PATH
              value: {{ .Values.survey.onnxPath | quote }}
            - name: SITL_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: ROS_DOMAIN_ID
              value: "{{ .Values.domains.mission }}"
            - name: RMW_IMPLEMENTATION
              value: "rmw_cyclonedds_cpp"
            - name: HOME
              value: "/tmp/ros-home"
            - name: ROS_LOG_DIR
              value: "/tmp/ros-log"
          resources: {{- toYaml .Values.resources.mission | nindent 12 }}
          securityContext: {{- include "px4.security" . | nindent 12 }}
          volumeMounts:
            - {name: mission-tmp, mountPath: /tmp}
          readinessProbe:
            exec: {command: ["python3", "/opt/mission/ready.py"]}
            periodSeconds: 5
            timeoutSeconds: 3
        - name: agent
          image: {{ index .Values.images "mission" | quote }}
          args: ["agent"]
          env:
            - name: ROS_DOMAIN_ID
              value: "{{ .Values.domains.mission }}"
            - name: RMW_IMPLEMENTATION
              value: "rmw_cyclonedds_cpp"
            - name: HOME
              value: "/tmp/ros-home"
            - name: ROS_LOG_DIR
              value: "/tmp/ros-log"
          resources: {{- toYaml .Values.resources.agent | nindent 12 }}
          securityContext: {{- include "px4.security" . | nindent 12 }}
          volumeMounts:
            - {name: agent-tmp, mountPath: /tmp}
        - name: camera-transport
          image: {{ index .Values.images "zenoh" | quote }}
          args: ["-c", "/etc/mission/zenoh.json5"]
          env:
            - name: ROS_DISTRO
              value: "jazzy"
          resources: {{- toYaml .Values.resources.transport | nindent 12 }}
          securityContext: {{- include "px4.security" . | nindent 12 }}
          volumeMounts:
            - {name: transport, mountPath: /etc/mission}
        - name: camera-viewer
          image: {{ index .Values.images "mission" | quote }}
          args: ["python3", "/opt/camera-view/camera_view.py"]
          env:
            # Keep DDS discovery multicast. Large camera samples use unicast.
            - name: CYCLONEDDS_URI
              value: "<CycloneDDS><Domain><General><AllowMulticast>spdp</AllowMulticast></General></Domain></CycloneDDS>"
            - name: SURVEY_ENABLED
              value: "true"
            - name: ROS_DOMAIN_ID
              value: "{{ .Values.domains.mission }}"
            - name: RMW_IMPLEMENTATION
              value: "rmw_cyclonedds_cpp"
            - name: HOME
              value: "/tmp/ros-home"
            - name: ROS_LOG_DIR
              value: "/tmp/ros-log"
          resources: {{- toYaml .Values.resources.dashboard | nindent 12 }}
          securityContext: {{- include "px4.security" . | nindent 12 }}
          volumeMounts:
            - {name: viewer-tmp, mountPath: /tmp}
          ports: [{name: dashboard, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /status, port: dashboard}
            periodSeconds: 5
